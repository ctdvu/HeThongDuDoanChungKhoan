services:
  - type: web
    name: vnindex-stock-predictor
    env: python
    region: singapore
    plan: free
    rootDir: RNN_CoPhieu/webapp
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TF_ENABLE_ONEDNN_OPTS
        value: 0
